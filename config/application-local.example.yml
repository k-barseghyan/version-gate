# Server configuration example. Adapter settings belong to their own namespaces.
# The placeholder adapter modules do not yet provide a VersionGateStore bean, so a
# local composition must supply one explicitly.

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

version-gate:
  maximum-lease: ${VERSION_GATE_MAXIMUM_LEASE:PT1H}
  maximum-snapshot-size: ${VERSION_GATE_MAXIMUM_SNAPSHOT_SIZE:1GB}
