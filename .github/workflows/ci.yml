name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp clean verify

      - name: Verify assembled server
        run: |
          SERVER_JAR=version-gate-server/target/version-gate-server-0.1.0-SNAPSHOT.jar
          jar tf "$SERVER_JAR" | grep -q '^BOOT-INF/'
          jar tf "$SERVER_JAR" | grep -q 'version-gate-control-postgres'
